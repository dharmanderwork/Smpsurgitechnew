    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalBusiness",
      "name": "SMP Surgitech",
      "legalName": "SMP Surgitech Medical Technologies Corp.",
      "description": "ISO 13485:2016 certified distributor of precision surgical instruments, cardiovascular clamps, orthopedic sets, and hospital consignment inventory.",

      "areaServed": "Global",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "SMP Surgical Instruments Catalog",
        "itemListElement": [
          {
            "@type": "OfferCatalog",
            "name": "Cardiovascular & Thoracic",

          },
          {
            "@type": "OfferCatalog",
            "name": "Orthopedics & Spine",
            "description": "German stainless bone rongeurs, Langenbeck retractors, osteotomes"
          },
          {
            "@type": "OfferCatalog",
            "name": "Neurosurgery & Micro-Surgery",
            "description": "Titanium non-magnetic bipolar forceps, micro-needle holders with tungsten carbide"
          }
        ]
      }
    }
